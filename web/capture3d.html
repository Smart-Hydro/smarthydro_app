<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SmartHydro · Punto 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #081114; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 14px; top: 12px; pointer-events: none;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #E8F2F1; font-size: 12px; letter-spacing: 1.2px; font-weight: 700;
    text-transform: uppercase;
  }
  #hud .status { color: #66E0C2; }
  #hint {
    position: fixed; right: 14px; bottom: 12px; pointer-events: none;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #9AB0B1; font-size: 10px; letter-spacing: .4px;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"><span id="kind">PUNTO</span> · <span class="status" id="status">CONECTADO</span></div>
<div id="hint">Arrastra para orbitar · Rueda/pinza para acercar</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

const params = new URLSearchParams(location.search);
const KIND = (params.get('kind') || 'well').toLowerCase();      // well | surface
const LEVEL = Math.min(1, Math.max(0, parseFloat(params.get('fill') ?? '0.6')));
const FLOW = Math.max(0, parseFloat(params.get('flow') ?? '2'));
const STATUS = (params.get('status') || 'connected').toLowerCase();

const COLORS = {
  connected: 0x66E0C2, gap: 0xFFC46B, incident: 0xFF847A,
};
const ACCENT = COLORS[STATUS] ?? COLORS.connected;
const WATER = KIND === 'surface' ? 0x2E8FB0 : 0x1E7C86;
const SKY = 0x0C181D;
const BG = 0x081114;

document.getElementById('kind').textContent =
  KIND === 'surface' ? 'AGUA SUPERFICIAL' : 'POZO SUBTERRÁNEO';
const statusLabel = { connected: 'CONECTADO', gap: 'ADVERTENCIA', incident: 'INCIDENCIA' };
document.getElementById('status').textContent = statusLabel[STATUS] ?? 'CONECTADO';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(BG, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BG, 12, 34);

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.52;

// Luces: ambiente suave + una clave cálida + un relleno frío.
scene.add(new THREE.AmbientLight(0xB8E6DA, 0.5));
const key = new THREE.DirectionalLight(0xFFF3E0, 1.0);
key.position.set(5, 9, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9FD4FF, 0.35);
fill.position.set(-6, 4, -4);
scene.add(fill);
const rim = new THREE.PointLight(ACCENT, 0.8, 24);
rim.position.set(0, 5.5, 0);
scene.add(rim);

function waterMaterial(opacity) {
  return new THREE.MeshPhysicalMaterial({
    color: WATER, transparent: true, opacity,
    roughness: 0.12, metalness: 0.0,
    transmission: 0.55, thickness: 1.4,
    clearcoat: 0.6, clearcoatRoughness: 0.2,
    side: THREE.DoubleSide,
  });
}

function glowMaterial(color, opacity) {
  return new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    depthWrite: false,
  });
}

// Plano de terreno / base.
function ground(y, color = 0x16343C) {
  const g = new THREE.Mesh(
    new THREE.CircleGeometry(16, 48),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.0 })
  );
  g.rotation.x = -Math.PI / 2;
  g.position.y = y;
  scene.add(g);
  return g;
}

// Anillo de acento (estado) en el suelo.
function accentRing(radius, y) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.03, 10, 60),
    glowMaterial(ACCENT, 0.85)
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = y;
  scene.add(ring);
  return ring;
}

const flowDots = [];
function makeFlowDot() {
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 10, 10),
    glowMaterial(0xBFF7EA, 0.9)
  );
  scene.add(dot);
  return dot;
}

// ——— Pozo subterráneo ———
function buildWell() {
  ground(0);
  accentRing(2.1, 0.02);
  // Boca del pozo (cuello)
  const collar = new THREE.Mesh(
    new THREE.TorusGeometry(0.95, 0.16, 12, 40),
    new THREE.MeshStandardMaterial({ color: 0x3A4A4A, roughness: 0.7 })
  );
  collar.rotation.x = -Math.PI / 2;
  collar.position.y = 0.02;
  scene.add(collar);
  // Cilindro exterior translúcido (corte conceptual del pozo)
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.9, 0.9, 6, 40, 1, true),
    new THREE.MeshStandardMaterial({
      color: 0xE8F2F1, transparent: true, opacity: 0.08,
      roughness: 0.4, side: THREE.DoubleSide, depthWrite: false,
    })
  );
  shaft.position.y = -3;
  scene.add(shaft);
  // Borde luminoso del casco.
  const edge = new THREE.Mesh(
    new THREE.TorusGeometry(0.9, 0.015, 8, 48),
    glowMaterial(ACCENT, 0.4)
  );
  edge.rotation.x = -Math.PI / 2;
  edge.position.y = 0.03;
  scene.add(edge);
  // Columna de agua: el nivel sube desde el fondo según LEVEL.
  const depth = 6;
  const h = Math.max(0.15, LEVEL * depth);
  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(0.82, 0.82, h, 40, 1, false),
    waterMaterial(0.85)
  );
  water.position.y = -depth + h / 2;
  scene.add(water);
  // Superficie del agua (disco brillante).
  const top = new THREE.Mesh(
    new THREE.CircleGeometry(0.82, 40),
    glowMaterial(0x8EF0D8, 0.4)
  );
  top.rotation.x = -Math.PI / 2;
  top.position.y = -depth + h + 0.001;
  scene.add(top);
  // Burbujas ascendentes.
  for (let i = 0; i < 16; i++) {
    const b = new THREE.Mesh(
      new THREE.SphereGeometry(0.04 + Math.random() * 0.04, 8, 8),
      glowMaterial(0xDFFFF6, 0.5)
    );
    b.userData = {
      a: Math.random() * Math.PI * 2,
      r: 0.2 + Math.random() * 0.5,
      s: 0.4 + Math.random() * 0.8,
      o: Math.random(),
    };
    scene.add(b);
    flowDots.push(b);
    b.userData.type = 'bubble';
  }
  camera.position.set(7, 5, 9);
  return { water, depth, h };
}

// ——— Agua superficial ———
function buildSurface() {
  ground(-1.2, 0x10222B);
  // Plano de agua grande.
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30, 80, 80),
    waterMaterial(0.8)
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = -0.2 + LEVEL * 0.6;
  scene.add(water);
  accentRing(2.4, water.position.y + 0.01);
  // Boya / punto de toma.
  const buoy = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 24, 24),
    new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.4, emissive: ACCENT, emissiveIntensity: 0.25 })
  );
  buoy.position.set(0, water.position.y + 0.2, 0);
  scene.add(buoy);
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 1.6, 12),
    new THREE.MeshStandardMaterial({ color: 0xE8F2F1, roughness: 0.5 })
  );
  mast.position.set(0, water.position.y + 0.9, 0);
  scene.add(mast);
  // Ondas concéntricas.
  const rings = [];
  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(1 + i * 0.7, 0.02, 8, 60),
      glowMaterial(0xBFF7EA, 0.3 - i * 0.08)
    );
    r.rotation.x = -Math.PI / 2;
    r.position.y = water.position.y + 0.01;
    scene.add(r);
    rings.push(r);
  }
  camera.position.set(8, 5.5, 8);
  return { water, buoy, rings, waves: water.geometry.attributes.position };
}

const ctx = KIND === 'surface' ? buildSurface() : buildWell();

// Puntos de flujo (caudal): partículas que emergen del punto.
for (let i = 0; i < 5; i++) flowDots.push(makeFlowDot());

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (KIND === 'surface') {
    const pos = ctx.waves;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x * 0.6 + t * 1.4) * 0.12 + Math.cos(y * 0.5 + t) * 0.1);
    }
    pos.needsUpdate = true;
    ctx.buoy.position.y = ctx.water.position.y + 0.2 + Math.sin(t * 1.6) * 0.06;
    ctx.buoy.position.x = Math.sin(t * 0.5) * 0.05;
    ctx.rings.forEach((r, i) => {
      const s = 1 + ((t * 0.4 + i / ctx.rings.length) % 1) * 1.6;
      r.scale.setScalar(s);
      r.material.opacity = 0.3 * (1 - ((t * 0.4 + i / ctx.rings.length) % 1));
    });
  } else {
    ctx.water.scale.y = 1 + Math.sin(t * 0.8) * 0.02;
    ctx.water.material.opacity = 0.8 + Math.sin(t * 0.8) * 0.05;
  }
  flowDots.forEach((d) => {
    if (d.userData.type === 'bubble') {
      const u = (t * d.userData.s * 0.2 + d.userData.o) % 1;
      const y0 = ctx.depth ? -ctx.depth + 0.2 : 0;
      d.position.set(
        Math.cos(d.userData.a) * d.userData.r,
        y0 + u * ctx.h,
        Math.sin(d.userData.a) * d.userData.r
      );
      d.material.opacity = Math.sin(u * Math.PI) * 0.6;
    } else {
      const u = (t * (0.3 + FLOW * 0.05) + d.id * 0.2) % 1;
      d.position.y = (KIND === 'surface' ? ctx.water.position.y : 0.2) + u * 3;
      d.material.opacity = Math.sin(u * Math.PI) * 0.8;
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
