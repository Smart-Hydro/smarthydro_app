<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Centro de control hídrico Ikolu Smart Hydro.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ikolu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ikolu · Smart Hydro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #081216;
      overflow: hidden;
    }
    /* Splash = estación de trabajo: base oscura + cuadrícula fina, sin halos. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #081216;
      background-image:
        linear-gradient(rgba(231, 244, 242, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231, 244, 242, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    flt-platform-view,
    flt-platform-view-slot {
      background: #081216 !important;
    }
  </style>
  <script>
    // El slot vive en el shadow root de flt-glass-pane. El CSS de la
    // página no entra ahí, y sin este color el hueco se ve blanco.
    (function () {
      var css = 'flt-platform-view, flt-platform-view-slot { background: #081216 !important; }';
      function inject(root) {
        if (!root || root.getElementById('pv-slot-dark')) return;
        var style = document.createElement('style');
        style.id = 'pv-slot-dark';
        style.textContent = css;
        root.appendChild(style);
      }
      function scan() {
        var panes = document.querySelectorAll('flt-glass-pane');
        for (var i = 0; i < panes.length; i++) {
          if (panes[i].shadowRoot) inject(panes[i].shadowRoot);
        }
      }
      new MutationObserver(scan).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      scan();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Staging en GitHub Pages: el service worker de Flutter deja JS viejo
    // y el equipo sigue viendo el N1 roto tras un deploy.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
