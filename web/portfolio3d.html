<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ikolu · Mapa hídrico</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A181F; overflow: hidden; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .label {
    position: absolute;
    transform: translate(-50%, -118%);
    color: #F4FBFA;
    font: 650 12px/1.15 -apple-system, 'Segoe UI', Roboto, sans-serif;
    letter-spacing: 0.1px;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }
  .label small {
    display: block;
    margin-top: 2px;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.2px;
  }
  #legend {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    overflow: hidden;
    pointer-events: none;
    font: 500 11px/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #7E9698;
    white-space: nowrap;
  }
  #legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
  }
  #legend b { font-weight: 500; }
  #legend i { width: 7px; height: 7px; border-radius: 99px; display: block; }
  #legend i.ok { background: #66E0C2; }
  #legend i.warn { background: #FFC46B; }
  #legend i.bad { background: #FF847A; }
  #legend i.kind {
    width: 6px;
    height: 6px;
    border-radius: 1.5px;
    background: #7EB8C4;
    transform: rotate(45deg);
  }
</style>
<script type="importmap">
  { "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="legend">
  <span><i class="ok"></i>Conectado</span>
  <span><i class="warn"></i><b id="warn-label">Advertencia</b></span>
  <span><i class="bad"></i><b id="bad-label">Incidencia</b></span>
  <span><i class="kind"></i>Pozo / superficial</span>
</div>
<script type="module">
import * as THREE from 'three';
import { boardTurns } from './board_cue.js';

const COLORS = { connected: 0x66E0C2, gap: 0xFFC46B, incident: 0xFF847A };
const BG = 0x0A181F;
const FLOW_ON = 0.2;
// Isometría: la cámara mira desde (1, 1, 1). El corte del pozo abre esa esquina.
const ISO = new THREE.Vector3(1, 1, 1).normalize();
// (−X, −Z) sube en pantalla. (+X, −Z) va a la derecha.
const SCREEN_UP = new THREE.Vector3(-1, 0, -1).normalize();
const SCREEN_RIGHT = new THREE.Vector3(1, 0, -1).normalize();

const canvas = document.getElementById('scene');
const labelLayer = document.getElementById('labels');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(BG, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.add(new THREE.AmbientLight(0xC5E4DC, 0.62));
const key = new THREE.DirectionalLight(0xFFF3E0, 1.15);
key.position.set(6, 10, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x9FD4FF, 0.38);
fill.position.set(-5, 4, -3);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 400);
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const _proj = new THREE.Vector3();
const _local = new THREE.Vector3();

let markers = [];
let hoverIndex = null;
const overview = {
  pos: new THREE.Vector3(),
  target: new THREE.Vector3(0, 0.4, 0),
};

const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion = motionQuery.matches;
motionQuery.addEventListener('change', () => {
  reduceMotion = motionQuery.matches;
});
window.addEventListener('wheel', (event) => {
  event.preventDefault();
}, { passive: false });

function tone(status) {
  return COLORS[status] || COLORS.connected;
}

function pointFlows(point) {
  const flow = typeof point.flow === 'number' && Number.isFinite(point.flow) ? point.flow : 0;
  return (point.status || 'connected') === 'connected' && flow > FLOW_ON;
}

function flowText(point) {
  const kind = point.surface ? 'Superficial' : 'Pozo';
  const flow = typeof point.flow === 'number' && Number.isFinite(point.flow) ? point.flow : null;
  if (flow == null || flow <= 0.05) return `${kind} · sin caudal`;
  const digits = Math.abs(flow) >= 10 ? 0 : 1;
  return `${kind} · ${flow.toFixed(digits)} L/s`;
}

function mute(mesh) {
  mesh.raycast = () => {};
  return mesh;
}

function tag(mesh, index) {
  mesh.userData.index = index;
  return mesh;
}

function solid(color, roughness = 0.86) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.04 });
}

function box(w, h, d, x, y, z, material, index) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  if (index == null) mute(mesh);
  else tag(mesh, index);
  return mesh;
}

function strataMaterial(color, opacity) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.62,
    metalness: 0,
    transparent: true,
    opacity,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
}

function waterMaterial(color, emissive, flowing) {
  return new THREE.MeshPhysicalMaterial({
    color,
    emissive,
    emissiveIntensity: flowing ? 0.72 : 0.22,
    roughness: 0.1,
    metalness: 0.02,
    clearcoat: 0.7,
    clearcoatRoughness: 0.16,
    transparent: true,
    opacity: flowing ? 0.94 : 0.8,
  });
}

function buildWell(accent, index, flowing) {
  const group = new THREE.Group();
  // Cubo cortado. La cámara está en (1, 1, 1): el cuadrante +X/+Z es la
  // esquina cercana y queda vacío para que la columna se vea de frente.
  const W = 0.64;
  const H = 1.42;
  const accentMat = new THREE.MeshStandardMaterial({
    color: accent, emissive: accent, emissiveIntensity: 1.05, roughness: 0.3,
  });
  group.userData.accent = accentMat;

  const body = solid(0x1A3038);
  const crust = [
    solid(0x243832), solid(0x243832),
    solid(0x3E6B52, 0.7), solid(0x14241C),
    solid(0x243832), solid(0x243832),
  ];
  // Losa trasera (z ≤ 0) y losa izquierda (x ≤ 0). El cuadrante cercano queda abierto.
  group.add(box(W * 2, H, W, 0, H / 2, -W / 2, body, index));
  group.add(box(W, H, W, -W / 2, H / 2, W / 2, body, index));
  // El fondo del corte es una pila de estratos transparentes, no una tapa opaca.
  const strata = [
    { y: 0.14, h: 0.18, color: 0x24342E, opacity: 0.78 },
    { y: 0.38, h: 0.16, color: 0x4A6452, opacity: 0.66 },
    { y: 0.6, h: 0.14, color: 0x7A906C, opacity: 0.55 },
    { y: 0.82, h: 0.12, color: 0x35D0DE, opacity: 0.62 },
  ];
  for (const band of strata) {
    const layer = strataMaterial(band.color, band.opacity);
    group.add(box(W * 1.02, band.h, W * 1.02, W * 0.48, band.y, W * 0.48, layer));
    group.add(box(0.1, band.h, W, 0.05, band.y, W / 2, layer));
    group.add(box(W, band.h, 0.1, W / 2, band.y, 0.05, layer));
  }
  group.add(box(W * 2, 0.1, W, 0, H + 0.05, -W / 2, crust, index));
  group.add(box(W, 0.1, W, -W / 2, H + 0.05, W / 2, crust, index));

  const shaftX = W * 0.48;
  const shaftZ = W * 0.48;
  const columnBase = 0.08;
  const columnTop = H + 0.08;
  const columnH = columnTop - columnBase;
  const water = tag(new THREE.Mesh(
    new THREE.CylinderGeometry(0.125, 0.125, columnH, 20),
    waterMaterial(0x3AD0E2, 0x19C6DE, flowing),
  ), index);
  water.position.set(shaftX, columnBase + columnH / 2, shaftZ);
  group.add(water);
  group.userData.water = water;
  group.userData.columnH = columnH;
  group.userData.columnBase = columnBase;
  group.userData.shaft = { x: shaftX, z: shaftZ };

  const casing = mute(new THREE.Mesh(
    new THREE.CylinderGeometry(0.165, 0.165, columnH + 0.04, 20, 1, true),
    new THREE.MeshStandardMaterial({
      color: 0xB7D0D4, roughness: 0.28, metalness: 0.45,
      transparent: true, opacity: 0.28, side: THREE.DoubleSide,
    }),
  ));
  casing.position.set(shaftX, columnBase + columnH / 2, shaftZ);
  group.add(casing);

  const collar = tag(new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.045, 10, 28),
    new THREE.MeshStandardMaterial({ color: 0xE7F2F0, roughness: 0.28, metalness: 0.7 }),
  ), index);
  collar.rotation.x = -Math.PI / 2;
  collar.position.set(shaftX, H + 0.12, shaftZ);
  group.add(collar);
  const mouth = tag(new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.13, 0.045, 20),
    waterMaterial(0x4AE0F0, 0x20D0E8, flowing),
  ), index);
  mouth.position.set(shaftX, H + 0.11, shaftZ);
  group.add(mouth);

  const pump = mute(new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.08, 0.14, 12),
    new THREE.MeshStandardMaterial({ color: 0xD5DEDC, roughness: 0.32, metalness: 0.55 }),
  ));
  pump.position.set(shaftX, 0.22, shaftZ);
  group.add(pump);

  const pool = mute(new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.04, 16),
    waterMaterial(0x1EAEBE, 0x127888, flowing),
  ));
  pool.position.set(W * 0.4, H + 0.12, -W * 0.52);
  group.add(pool);

  const cabinet = mute(new THREE.Mesh(
    new THREE.BoxGeometry(0.24, 0.34, 0.16),
    new THREE.MeshStandardMaterial({ color: 0xE4EEEC, roughness: 0.4, metalness: 0.16 }),
  ));
  cabinet.position.set(-W * 0.38, H + 0.27, -W * 0.34);
  group.add(cabinet);
  const lamp = mute(new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 14), accentMat));
  lamp.position.set(-W * 0.38, H + 0.5, -W * 0.34);
  group.add(lamp);

  const dots = [];
  for (let i = 0; i < 3; i++) {
    const dot = mute(new THREE.Mesh(
      new THREE.SphereGeometry(0.026, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xE7FFF8, transparent: true, opacity: 0 }),
    ));
    dot.userData.orbit = i / 3;
    group.add(dot);
    dots.push(dot);
  }
  group.userData.dots = dots;
  group.userData.hx = W + 0.08;
  group.userData.hy = H + 0.58;
  group.userData.hz = W + 0.08;
  group.userData.kind = 'well';
  return group;
}

function bankMaterials(innerIsPositiveZ) {
  const outer = solid(0x1C3028);
  const inner = solid(0x3A6070, 0.66);
  const top = solid(0x3A624C, 0.7);
  const side = solid(0x294338);
  // +x, -x, +y, -y, +z, -z. El cauce corre en X: la pared mojada mira al centro.
  return [
    side, side, top, solid(0x14241C),
    innerIsPositiveZ ? inner : outer,
    innerIsPositiveZ ? outer : inner,
  ];
}

function buildSurface(accent, index, flowing) {
  const group = new THREE.Group();
  const accentMat = new THREE.MeshStandardMaterial({
    color: accent, emissive: accent, emissiveIntensity: 0.95, roughness: 0.3,
  });
  group.userData.accent = accentMat;
  const bankH = 0.74;
  // Dos riberas y el lecho. En la cara +X se ve el corte en U.
  group.add(box(1.55, bankH, 0.34, 0, bankH / 2, 0.5, bankMaterials(false), index));
  group.add(box(1.55, bankH, 0.34, 0, bankH / 2, -0.5, bankMaterials(true), index));
  group.add(box(1.55, 0.16, 0.7, 0, 0.08, 0, solid(0x101E22, 0.94), index));
  const depth = flowing ? 0.26 : 0.13;
  const water = tag(new THREE.Mesh(
    new THREE.BoxGeometry(1.55, depth, 0.46),
    waterMaterial(0x3AD0E2, 0x1490B0, flowing),
  ), index);
  water.position.set(0, 0.16 + depth / 2, 0);
  group.add(water);
  group.userData.water = water;

  const buoy = mute(new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), accentMat));
  buoy.position.set(0.18, 0.16 + depth + 0.08, 0);
  group.add(buoy);
  const mast = mute(new THREE.Mesh(
    new THREE.CylinderGeometry(0.016, 0.016, 0.26, 8),
    solid(0xE8F2F1, 0.4),
  ));
  mast.position.set(0.46, bankH + 0.12, 0.5);
  group.add(mast);

  const streaks = [];
  for (let i = 0; i < 3; i++) {
    const streak = mute(new THREE.Mesh(
      new THREE.BoxGeometry(0.26, 0.02, 0.035),
      new THREE.MeshBasicMaterial({
        color: 0xD9FFF6, transparent: true, opacity: 0,
      }),
    ));
    streak.position.set(0, 0.16 + depth + 0.02, -0.12 + i * 0.12);
    streak.userData.lane = i / 3;
    group.add(streak);
    streaks.push(streak);
  }
  group.userData.streaks = streaks;
  group.userData.hx = 0.86;
  group.userData.hy = bankH + 0.28;
  group.userData.hz = 0.72;
  group.userData.kind = 'surface';
  return group;
}

function slots(count) {
  const rows = Math.ceil(count / 2);
  const stepUp = 2.7;
  const stepRight = 2.35;
  const places = [];
  for (let i = 0; i < count; i++) {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const up = ((rows - 1) / 2 - row) * stepUp + (col === 1 ? stepUp * 0.16 : 0);
    const right = (col === 0 ? -0.5 : 0.5) * stepRight;
    places.push(
      SCREEN_UP.clone().multiplyScalar(up).add(SCREEN_RIGHT.clone().multiplyScalar(right)),
    );
  }
  return places;
}

const ISO_AZ = Math.PI / 4;
const ISO_POLAR = Math.acos(1 / Math.sqrt(3));
let orbitAz = ISO_AZ;
let orbitPolar = ISO_POLAR;
let userMoved = false;
let viewTime = 0;

function boundsOf(marker) {
  const points = [];
  const scale = marker.scale.x || 1;
  const hx = marker.userData.hx * scale;
  const hy = marker.userData.hy * scale;
  const hz = marker.userData.hz * scale;
  for (const x of [-hx, hx]) {
    for (const y of [0, hy]) {
      for (const z of [-hz, hz]) {
        points.push(new THREE.Vector3(
          marker.position.x + x,
          marker.position.y + y,
          marker.position.z + z,
        ));
      }
    }
  }
  return points;
}

function viewDirection(azimuth, polar) {
  const sinP = Math.sin(polar);
  return new THREE.Vector3(
    sinP * Math.sin(azimuth),
    Math.cos(polar),
    sinP * Math.cos(azimuth),
  );
}

function frameCamera() {
  const still = new URLSearchParams(location.search).get('still') === '1';
  const drift = !still && !userMoved && !reduceMotion ? Math.sin(viewTime * 0.32) * 0.42 : 0;
  const azimuth = (userMoved ? orbitAz : ISO_AZ) + drift;
  const focus = overview.target;
  camera.fov = 30;
  camera.aspect = camera.userData.aspect || 0.6;
  camera.near = 0.1;
  camera.far = 400;
  const samples = [];
  if (!markers.length) {
    samples.push(new THREE.Vector3(-1, 0, -1), new THREE.Vector3(1, 1.4, 1));
  }
  for (const marker of markers) samples.push(...boundsOf(marker));
  let dist = 8;
  const dir = viewDirection(azimuth, orbitPolar);
  for (let attempt = 0; attempt < 10; attempt++) {
    camera.position.copy(focus).addScaledVector(dir, dist);
    camera.up.set(0, 1, 0);
    camera.lookAt(focus);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    let peak = 0.001;
    for (const point of samples) {
      _proj.copy(point).project(camera);
      peak = Math.max(peak, Math.abs(_proj.x), Math.abs(_proj.y));
    }
    const next = Math.max(0.55, dist * (peak / 0.84));
    if (Math.abs(next - dist) < 0.05) {
      dist = next;
      break;
    }
    dist = next;
  }
  camera.position.copy(focus).addScaledVector(dir, dist);
  camera.up.set(0, 1, 0);
  camera.lookAt(focus);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  overview.pos.copy(camera.position);
}

function paintLegend(points) {
  const gaps = points.filter((point) => point && point.status === 'gap').length;
  const incidents = points.filter((point) => point && point.status === 'incident').length;
  const warn = document.getElementById('warn-label');
  const bad = document.getElementById('bad-label');
  if (warn) warn.textContent = gaps ? `Advertencia · ${gaps}` : 'Advertencia';
  if (bad) bad.textContent = incidents ? `Incidencia · ${incidents}` : 'Incidencia';
}

function clearScene() {
  for (const child of [...scene.children]) {
    if (child.isLight) continue;
    child.traverse((node) => {
      if (node.geometry) node.geometry.dispose();
      const material = node.material;
      if (!material) return;
      const list = Array.isArray(material) ? material : [material];
      for (const item of list) item.dispose();
    });
    scene.remove(child);
  }
  labelLayer.replaceChildren();
  markers = [];
}

function rebuild(points) {
  clearScene();
  paintLegend(points);
  const count = points.length;
  if (!count) {
    overview.target.set(0, 0.4, 0);
    frameCamera();
    return;
  }
  const places = slots(count);
  let cx = 0;
  let cz = 0;
  for (const place of places) {
    cx += place.x;
    cz += place.z;
  }
  overview.target.set(cx / count, 0.5, cz / count);
  for (let index = 0; index < count; index++) {
    const point = points[index] || {};
    const flowing = pointFlows(point);
    const accent = tone(point.status);
    const marker = point.surface
      ? buildSurface(accent, index, flowing)
      : buildWell(accent, index, flowing);
    marker.position.copy(places[index]);
    marker.userData.index = index;
    marker.userData.col = count > 1 ? index % 2 : -1;
    marker.userData.flowing = flowing;
    const flow = typeof point.flow === 'number' && Number.isFinite(point.flow) ? point.flow : 0;
    marker.userData.flowSpeed = 0.45 + Math.min(Math.max(flow, 0), 12) / 12 * 1.15;
    scene.add(marker);
    markers.push(marker);

    const label = document.createElement('div');
    label.className = 'label';
    const name = document.createElement('span');
    name.textContent = String(point.title || 'Punto');
    const meta = document.createElement('small');
    meta.textContent = flowText(point);
    meta.style.color = `#${accent.toString(16).padStart(6, '0')}`;
    label.append(name, meta);
    labelLayer.appendChild(label);
    marker.userData.labelEl = label;
  }
  frameCamera();
}

let down = null;
let pageLock = 0;
let wheelDown = 0;
let wheelStamp = 0;

function overviewDistance() {
  return overview.pos.distanceTo(overview.target);
}

function atPoster() {
  return boardTurns(40, camera.position.distanceTo(overview.target), overviewDistance(), false);
}

function turnPage() {
  const now = performance.now();
  if (now < pageLock) return;
  pageLock = now + 700;
  wheelDown = 0;
  window.parent.postMessage({ source: 'portfolio3d', type: 'page', direction: 'down' }, '*');
}

function pickIndex(event) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  ndc.set(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1,
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(markers, true);
  const picked = hits.find((hit) => hit.object.userData.index != null);
  return picked ? picked.object.userData.index : null;
}

canvas.addEventListener('wheel', (event) => {
  if (!boardTurns(event.deltaY, camera.position.distanceTo(overview.target), overviewDistance(), false)) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const now = performance.now();
  if (now - wheelStamp > 240) wheelDown = 0;
  wheelStamp = now;
  wheelDown += event.deltaY;
  if (wheelDown >= 36) turnPage();
}, { capture: true, passive: false });

canvas.addEventListener('pointerdown', (event) => {
  down = {
    x: event.clientX,
    y: event.clientY,
    poster: atPoster(),
    az: orbitAz,
    polar: orbitPolar,
    orbiting: false,
  };
});
canvas.addEventListener('pointermove', (event) => {
  hoverIndex = pickIndex(event);
  canvas.style.cursor = hoverIndex == null ? 'default' : 'pointer';
  if (!down) return;
  const dx = event.clientX - down.x;
  const dy = event.clientY - down.y;
  if (!down.orbiting && dx * dx + dy * dy > 36 && Math.abs(dx) > Math.abs(dy) * 0.75) {
    down.orbiting = true;
    userMoved = true;
  }
  if (!down.orbiting) return;
  orbitAz = THREE.MathUtils.clamp(down.az - dx * 0.006, ISO_AZ - 0.5, ISO_AZ + 0.5);
  orbitPolar = THREE.MathUtils.clamp(
    down.polar + dy * 0.0035,
    ISO_POLAR - 0.2,
    ISO_POLAR + 0.16,
  );
});
canvas.addEventListener('pointerleave', () => {
  hoverIndex = null;
  canvas.style.cursor = 'default';
});
canvas.addEventListener('pointerup', (event) => {
  if (!down) return;
  const dx = event.clientX - down.x;
  const dy = event.clientY - down.y;
  const poster = down.poster;
  const orbiting = down.orbiting;
  down = null;
  if (orbiting) return;
  if (poster && dy < -72 && -dy > Math.abs(dx) * 1.6) {
    turnPage();
    return;
  }
  if (dx * dx + dy * dy > 36) return;
  const index = pickIndex(event);
  if (index == null) return;
  window.parent.postMessage({ source: 'portfolio3d', type: 'select', index }, '*');
});

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.source !== 'smarthydro') return;
  if (data.type === 'portfolio') rebuild(Array.isArray(data.points) ? data.points : []);
});

function placeLabels() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  for (const marker of markers) {
    const label = marker.userData.labelEl;
    if (!label) continue;
    const col = marker.userData.col;
    marker.getWorldPosition(_proj);
    _proj.y += marker.userData.hy * 0.55;
    _proj.project(camera);
    let y = (-_proj.y * 0.5 + 0.5) * height;
    y = Math.min(height - 36, Math.max(20, y));
    label.style.visibility = 'visible';
    label.style.top = `${y}px`;
    if (col === 1) {
      label.style.left = `${width - 10}px`;
      label.style.transform = 'translate(-100%, -50%)';
      label.style.textAlign = 'right';
    } else {
      label.style.left = '10px';
      label.style.transform = 'translate(0, -50%)';
      label.style.textAlign = 'left';
    }
  }
  const left = [];
  const right = [];
  for (const marker of markers) {
    const label = marker.userData.labelEl;
    if (!label) continue;
    (marker.userData.col === 1 ? right : left).push(label);
  }
  for (const column of [left, right]) {
    column.sort((a, b) => parseFloat(a.style.top) - parseFloat(b.style.top));
    for (let i = 1; i < column.length; i++) {
      const prev = parseFloat(column[i - 1].style.top);
      const y = parseFloat(column[i].style.top);
      if (y - prev < 30) column[i].style.top = `${prev + 30}px`;
    }
  }
}

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height, false);
  camera.userData.aspect = Math.max(width, 1) / Math.max(height, 1);
  camera.aspect = camera.userData.aspect;
  frameCamera();
}
window.addEventListener('resize', resize);
resize();

if (window.parent === window) {
  rebuild([
    { title: 'Norte', surface: false, status: 'connected', flow: 8.2 },
    { title: 'Estero', surface: true, status: 'gap', flow: 1.4 },
    { title: 'P3', surface: false, status: 'connected', flow: 0 },
    { title: 'P4', surface: false, status: 'connected', flow: 4.6 },
    { title: 'P5', surface: false, status: 'incident', flow: 6 },
    { title: 'P6', surface: false, status: 'connected', flow: 11 },
    { title: 'P2', surface: false, status: 'connected', flow: 2.2 },
  ]);
} else {
  rebuild([]);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  viewTime = clock.getElapsedTime();
  frameCamera();
  const time = viewTime;
  for (const marker of markers) {
    const hot = marker.userData.index === hoverIndex;
    const accent = marker.userData.accent;
    if (accent) {
      const pulse = reduceMotion ? 0 : Math.sin(time * 2.1 + marker.userData.index) * 0.14;
      accent.emissiveIntensity = (hot ? 1.4 : 1) + pulse;
    }
    const flowing = marker.userData.flowing && !reduceMotion;
    const speed = marker.userData.flowSpeed || 0.6;
    const dots = marker.userData.dots;
    if (dots) {
      const shaft = marker.userData.shaft;
      const column = marker.userData.columnH || 0.4;
      dots.forEach((dot) => {
        dot.material.opacity = flowing ? 0.9 : 0;
        if (!flowing) return;
        const u = (time * speed * 0.35 + dot.userData.orbit) % 1;
        const angle = dot.userData.orbit * Math.PI * 2;
        const base = marker.userData.columnBase || 0.2;
        dot.position.set(
          shaft.x + Math.cos(angle) * 0.035,
          base + u * column,
          shaft.z + Math.sin(angle) * 0.035,
        );
      });
    }
    const streaks = marker.userData.streaks;
    if (streaks) {
      streaks.forEach((streak) => {
        streak.material.opacity = flowing ? 0.55 : 0;
        if (!flowing) return;
        const u = (time * speed * 0.28 + streak.userData.lane) % 1;
        streak.position.x = -0.55 + u * 1.15;
      });
    }
  }
  placeLabels();
  renderer.render(scene, camera);
}
animate();
</script>
